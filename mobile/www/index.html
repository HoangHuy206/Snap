<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VidQR Studio</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b0f19;
        color: #f8fafc;
        text-align: center;
      }
      .card {
        max-width: 360px;
        width: 100%;
        padding: 24px 20px;
        border-radius: 18px;
        background: #111827;
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 18px;
        font-size: 14px;
        line-height: 1.5;
        color: #cbd5e1;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: #4f46e5;
        color: #ffffff;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>VidQR Studio</h1>
      <p>Ứng dụng cần kết nối Internet để tạo mã QR động &amp; tải video không logo.</p>
      <a href="https://vidqr-studio.vercel.app">Thử kết nối lại</a>
    </main>
  </body>
</html>
